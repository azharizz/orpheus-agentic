apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: grafana-mcp
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/ingress: all
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: grafana-mcp@orpheus-agentic.iam.gserviceaccount.com
      containers:
        - image: grafana/mcp-grafana@sha256:5114852743e450fe5186b6c1712419843eb4bd295e47e64c452c3aa0fab3c42e
          args:
            - -t
            - streamable-http
            - -address
            - :8000
            - --disable-write
            - --allowed-hosts
            - grafana-mcp-3obekfb6xq-uc.a.run.app,grafana-mcp-1777106151.us-central1.run.app
            - --enabled-tools
            - datasource,prometheus,loki,tempo,dashboard,navigation,alerting
          env:
            - name: GRAFANA_URL
              value: https://crimsonagave361.grafana.net
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-service-account-token
                  key: latest
            - name: MCP_GRAFANA_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-caller-token
                  key: latest
          ports:
            - containerPort: 8000
